# SERVER PORT
server.port=${PORT:8087}

# =========================================================================
# LOCAL & PRODUCTION CONFIGURATION (PostgreSQL)
# =========================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/car_parts_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Optional Local Profile Config Import (Ignored by Git for zero secret leaks)
spring.config.import=optional:classpath:application-local.properties

# =========================================================================
# PAYMENT METHOD FOR RAZORPAY ONLINE PAYMENT
# =========================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Developer 0.5% Commission Account (Razorpay Route Linked Account ID)
developer.razorpay.account.id=${DEVELOPER_RAZORPAY_ACCOUNT_ID:}